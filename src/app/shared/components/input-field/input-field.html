<mat-form-field
  class="full-width"
  [appearance]="config.appearance || 'outline'"
  [subscriptSizing]="config.subscriptSizing || 'dynamic'"
>
  <mat-label>
    {{ config.label }}
    <!-- @if (isRequired) {
    <span class="required-star">*</span>
    } -->
  </mat-label>

  @if (config.prefixIcon) {
  <mat-icon matPrefix class="prefix-icon">{{ config.prefixIcon }}</mat-icon>
  }

  <input
    matInput
    [formControl]="config.control!"
    [type]="inputType"
    [placeholder]="config.placeholder || ''"
    [readonly]="config.readonly"
    [attr.minlength]="config.minlength"
    [attr.maxlength]="config.maxlength"
    [attr.min]="config.min"
    [attr.max]="config.max"
    [attr.step]="config.step"
    [attr.pattern]="config.pattern"
    (input)="handleInput($event)"
    (focus)="config.control?.markAsTouched()"
  />

  @if (config.type === 'password') {
  <button
    mat-icon-button
    matSuffix
    type="button"
    (click)="togglePassword()"
    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
    tabindex="-1"
  >
    <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
  }
   @if ( (config.iconPath || config.icon) && config.type !== 'password' && ( config.icon !==
  'close' || config.control?.value ) ) {
  <span matSuffix>
    <button mat-icon-button type="button" (click)="handleIconClick()">
      @if (config.iconPath) {
      <img [src]="config.iconPath" width="22" height="22" alt="icon" />
      } @else if (config.icon) {
      <mat-icon>{{ config.icon }}</mat-icon>
      }
    </button>
  </span>
  } @if (config.hint) {
  <mat-hint>{{ config.hint }}</mat-hint>
  }

  <mat-error *ngIf="config.control?.invalid && (config.control?.dirty || config.control?.touched)">
    {{ errorMessage }}
  </mat-error>
</mat-form-field>
