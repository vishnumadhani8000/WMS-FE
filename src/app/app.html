<form
  [formGroup]="loginForm"
  (ngSubmit)="submit()">
  <app-common-input label="Email" type="email" prefixIcon="email" formControlName="email" />

  <app-common-input label="Password " type="password"  formControlName="password" />


  <app-common-button
  label="Sub"
  type="reset"
  variant="flat"
  color="primary"
  suffixIcon="email"
  [fullWidth]="true"
  [loading]="isSubmitting"
/>

<app-common-button
label="Submit"
type="submit"
variant="stroked"
color="accent"
[fullWidth]="true"
/>

<app-common-select
  formControlName="role"
  label="Role"
  prefixIcon="person"
  [options]="roles">
</app-common-select>

<app-common-select
  formControlName="role"
  label="Role"
  prefixIcon="person"
  [options]="roles">
</app-common-select>

<app-common-textarea
  formControlName="description"
  label="Description"
  [rows]="3"
  [maxlength]="200">
</app-common-textarea>

</form>
