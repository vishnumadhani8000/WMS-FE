<app-form-dialog
  title="Select Delivery Address"
  subtitle="Choose a saved address for this delivery."
  [closeButtonConfig]="closeButtonConfig"
  [cancelButtonConfig]="cancelButtonConfig"
  [submitButtonConfig]="continueButtonConfig">

  <div class="address-list">

    @for (address of addresses; track address.addressId) {
      <button
        type="button"
        class="address-card"
        [class.address-card--selected]="selectedAddressId === address.addressId"
        (click)="selectAddress(address.addressId)">

        <span class="radio-outer">
          @if (selectedAddressId === address.addressId) {
            <span class="radio-inner"></span>
          }
        </span>

        <div class="address-card__content">
          <span class="address-card__body">

            <span class="address-card__line">
              {{ address.addressLine }}
            </span>

            @if (address.landmark) {
              <span class="address-card__line address-card__line--muted">
                Landmark: {{ address.landmark }}
              </span>
            }

            <span class="address-card__line address-card__line--muted">
              {{ address.cityName }}, {{ address.stateName }} – {{ address.pincode }}
            </span>

          </span>

          <button
            type="button"
            class="delete-btn"
            (click)="deleteAddress($event, address)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>

      </button>
    }

    @if (!addresses.length) {
      <div class="empty-state">
        <mat-icon>location_off</mat-icon>
        <p>No saved addresses yet.</p>
        <span>Add one below to get started.</span>
      </div>
    }

  </div>

  <button
    type="button"
    class="add-address-btn"
    (click)="openAddAddress()">
    <mat-icon>add</mat-icon>
    Add New Address
  </button>

</app-form-dialog>
