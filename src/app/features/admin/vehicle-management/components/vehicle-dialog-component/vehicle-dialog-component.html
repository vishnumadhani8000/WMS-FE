
    <app-form-dialog
    [title]="title" 
    [subtitle]="isEdit
      ? 'Update vehicle details and save changes.'
      : 'Fill in the details to register a new vehicle.'"
    [closeButtonConfig]="closeButtonConfig"
    [cancelButtonConfig]="cancelButtonConfig"
    [submitButtonConfig]="submitButtonConfig">

      <form [formGroup]="form" class="dialog-body" novalidate>

        <!-- Vehicle Name -->
        <div class="field-group">
          <app-common-input
          [config]="vehicleNameConfig"
          >
          </app-common-input>
        </div>
    
        <!-- Plate Number -->
        <div class="field-group">
          <app-common-input
          [config]="plateNumberConfig"/>
        </div>
    
        <!-- Capacity -->
        <div class="field-group">
          <app-common-input
          [config]="capacityConfig"/>
        </div>
    
        <!-- Availability Toggle -->
        <div class="field-group toggle-group">
          <div class="toggle-label-wrap">
            <span class="toggle-label">Availability</span>
            <span class="toggle-hint">
              Mark whether this vehicle is currently available for dispatch.
            </span>
          </div>
    
          <mat-slide-toggle
            formControlName="isAvailable"
            color="primary"
            class="availability-toggle"
          >
            <span class="toggle-value-label">
              {{ form.get('isAvailable')?.value ? 'Available' : 'Unavailable' }}
            </span>
          </mat-slide-toggle>
        </div>

      </form>
