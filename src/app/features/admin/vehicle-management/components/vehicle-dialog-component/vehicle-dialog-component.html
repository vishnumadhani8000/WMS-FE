<div class="dialog-wrapper">
    <div class="dialog-header">
      <div class="dialog-header__content">
        <h2 class="dialog-title">
          {{ title }}
        </h2>
  
        <p class="dialog-subtitle">
          @if (isEdit) { Update vehicle details and save changes. }
          @else { Fill in the details to register a new vehicle. }
        </p>
      </div>
  
      <button
        class="close-btn"
        mat-icon-button
        type="button"
        (click)="cancel()"
        aria-label="Close dialog"
      >
        <mat-icon> close </mat-icon>
      </button>
    </div>
  
    <mat-divider></mat-divider>
  
    <form [formGroup]="form" class="dialog-body" (ngSubmit)="submit()" novalidate>
  
      <!-- Vehicle Name -->
      <div class="field-group">
        <app-common-input
        [config]="vehicleNameConfig"
          formControlName="name"
        >
        </app-common-input>
      </div>
  
      <!-- Plate Number -->
      <div class="field-group">
        <app-common-input
        [config]="plateNumberConfig"
        formControlName="plateNumber"
        >
        </app-common-input>
      </div>
  
      <!-- Capacity -->
      <div class="field-group">
        <app-common-input
        [config]="capacityConfig"
          formControlName="capacityKg"
        >
        </app-common-input>
      </div>
  
      <!-- Availability Toggle -->
      <div class="field-group toggle-group">
        <div class="toggle-label-wrap">
          <span class="toggle-label">Availability</span>
          <span class="toggle-hint">
            Mark whether this vehicle is currently available for dispatch.
          </span>
        </div>
  
        <mat-slide-toggle
          formControlName="isAvailable"
          color="primary"
          class="availability-toggle"
        >
          <span class="toggle-value-label">
            {{ form.get('isAvailable')?.value ? 'Available' : 'Unavailable' }}
          </span>
        </mat-slide-toggle>
      </div>
  
    </form>
  
    <mat-divider></mat-divider>
  
    <div class="dialog-footer">
  
      <!-- Cancel -->
      <app-common-button
        label="Cancel"
        variant="stroked"
        color="default"
        (clicked)="cancel()"
      >
      </app-common-button>
  
      <!-- Submit -->
      <app-common-button
        [label]="isEdit ? 'Save Changes' : 'Add Vehicle'"
        variant="flat"
        color="primary"
        [loading]="saving"
        [disabled]="saving"
        (clicked)="submit()"
      >
      </app-common-button>
  
    </div>
  </div>
