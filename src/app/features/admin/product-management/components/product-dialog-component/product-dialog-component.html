<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-header__content">
      <h2 class="dialog-title">
        {{ title }}
      </h2>

      <p class="dialog-subtitle">
        @if (isEdit) { Update product details and save changes. }
        @else { Fill in the details to create a new product. }
      </p>
    </div>

    <button
      class="close-btn"
      mat-icon-button
      type="button"
      (click)="cancel()"
      aria-label="Close dialog"
    >
      <mat-icon> close </mat-icon>
    </button>
  </div>

  <mat-divider></mat-divider>

  <form [formGroup]="form" class="dialog-body" (ngSubmit)="submit()" novalidate>
    <div class="field-group">
      <app-common-input
       [config]="productNameConfig"
        formControlName="name"
      >
      </app-common-input>
    </div>

    <div class="two-col">
      <!-- Weight -->
      <div class="field-group">
        <app-common-input
          [config]="weightConfig"
          formControlName="weightKg"
        >
        </app-common-input>
      </div>

      <!-- Stock -->
      <div class="field-group">
        <app-common-input
          [config]="stockConfig"
          formControlName="stock"
        >
        </app-common-input>
      </div>
    </div>

    <div class="field-group">
      <app-common-input
        [config]="descriptionConfig"
        formControlName="description"
        >
      </app-common-input>
    </div>
  </form>

  <mat-divider></mat-divider>

  <div class="dialog-footer">
    <!-- Cancel -->
    <app-common-button label="Cancel" variant="stroked" color="default" (clicked)="cancel()">
    </app-common-button>

    <!-- Submit -->
    <app-common-button
      [label]="isEdit ? 'Save Changes' : 'Add Product'"
      variant="flat"
      color="primary"
      [loading]="saving"
      [disabled]="saving"
      (clicked)="submit()"
    >
    </app-common-button>
  </div>
</div>
