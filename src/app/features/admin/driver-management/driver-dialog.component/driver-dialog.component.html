<app-form-dialog
  [title]="title"
  [subtitle]="isEdit
    ? 'Update driver details and save changes.'
    : 'Fill in the details to register a new driver.'"
  [closeButtonConfig]="closeButtonConfig"
  [cancelButtonConfig]="cancelButtonConfig"
  [submitButtonConfig]="submitButtonConfig">

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate>

    <app-common-input [config]="nameConfig" />

    <app-common-input [config]="phoneConfig" />

    <app-common-input [config]="licenceConfig" />

    <div class="toggle-group">
      <div class="toggle-label-wrap">
        <span class="toggle-label">Availability</span>
        <span class="toggle-hint">
          Mark whether this driver is currently available for delivery.
        </span>
      </div>

      <mat-slide-toggle
        formControlName="isAvailable"
        color="primary">
        <span class="toggle-value-label">
          {{ form.get('isAvailable')?.value ? 'Available' : 'Unavailable' }}
        </span>
      </mat-slide-toggle>
    </div>

  </form>

</app-form-dialog>
