<div class="dialog-wrapper">
    <!-- Header -->
    <div class="dialog-header">
      <div class="dialog-header__content">
        <h2 class="dialog-title">Add City</h2>
        <p class="dialog-subtitle">
          Fill in the details to add a new city to
          <strong>{{ selectedStateName }}</strong>.
        </p>
      </div>
      <app-common-button [config]="closeButtonConfig" />
    </div>
  
    <mat-divider />
  
    <!-- Body -->
    <form [formGroup]="form" class="dialog-body" (ngSubmit)="submit()" novalidate>
      <!-- City name -->
      <div class="field-group">
        <app-common-input [config]="nameConfig" />
      </div>
  
      <!-- State dropdown -->
      <div class="field-group">
        <app-common-select [config]="stateSelectConfig" />
      </div>
    </form>
  
    <mat-divider />
  
    <!-- Footer -->
    <div class="dialog-footer">
      <app-common-button [config]="cancelButtonConfig" />
      <app-common-button [config]="submitButtonConfig" />
    </div>
  </div>
