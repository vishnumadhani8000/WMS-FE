
<app-form-dialog
  title="Edit City"
  subtitle="Update city details and save changes."
  [closeButtonConfig]="closeButtonConfig"
  [cancelButtonConfig]="cancelButtonConfig"
  [submitButtonConfig]="submitButtonConfig">

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate>

    <div class="field-group">
      <app-common-input [config]="nameConfig" />
    </div>

  </form>
</app-form-dialog>
