
  <app-form-dialog
    [title]="title"
    [subtitle]="isEdit
      ? 'Update state details and save changes.'
      : 'Fill in the details to add a new state.'"
    [closeButtonConfig]="closeButtonConfig"
    [cancelButtonConfig]="cancelButtonConfig"
    [submitButtonConfig]="submitButtonConfig">

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate>

      <app-common-input [config]="nameConfig" />

    </form>
