<!-- login.html -->

<div class="login-wrapper">
  <div class="login-card">

    <!-- LOGO -->
    <div class="login-logo">
      <mat-icon class="logo-icon">warehouse</mat-icon>
    </div>

    <!-- HEADER -->
    <div class="login-header">
      <h1 class="login-title">Welcome</h1>
      <p class="login-subtitle">Sign in or create your WMS account</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="auth-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'login'"
        type="button"
        (click)="setTab('login')"
      >
        Login
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'signup'"
        type="button"
        (click)="setTab('signup')"
      >
        Sign Up
      </button>
      <span class="tab-indicator" [class.right]="activeTab === 'signup'"></span>
    </div>

    <!-- ── LOGIN FORM ── -->
    @if (activeTab === 'login') {
      <form class="auth-form" [formGroup]="form" autocomplete="off">

        <app-common-input [config]="emailConfig" />
        <app-common-input [config]="passwordConfig" />
        <app-common-button [config]="loginButtonConfig" />

      </form>

      <p class="switch-hint">
        Don't have an account?
        <button type="button" class="switch-link" (click)="setTab('signup')">Sign Up</button>
      </p>
    }

    <!-- ── SIGN UP FORM ── -->
    @if (activeTab === 'signup') {
      <form class="auth-form" [formGroup]="signUpForm" autocomplete="off">

        <app-common-input [config]="nameConfig" />
        <app-common-input [config]="signUpEmailConfig" />
        <app-common-input [config]="phoneConfig" />
        <app-common-input [config]="signUpPasswordConfig" />
        <app-common-input [config]="confirmPasswordConfig" />
        <app-common-button [config]="signUpButtonConfig" />

      </form>

      <p class="switch-hint">
        Already have an account?
        <button type="button" class="switch-link" (click)="setTab('login')">Login</button>
      </p>
    }

  </div>
</div>
